[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scotus"
version = "1.0.0"
description = "Predicting each Supreme Court justice's vote from the oral-argument transcript (CS230, Stanford, Autumn 2026)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Matthew Wirtz" }]

[tool.setuptools.packages.find]
where = ["src"]
